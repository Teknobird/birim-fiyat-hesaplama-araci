<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Birim Fiyat Hesaplama Aracı | Teknobird</title>
<meta name="description" content="Ürünlerin birim fiyatını hesaplayın, farklı paket boyutlarını karşılaştırın ve en ekonomik seçeneği saniyeler içinde bulun.">
<style>
:root{--red:#e5252a;--red-d:#b81a1f;--red-l:#fdecec;--ink:#1c1c24;--mut:#6b6f7b;--line:#e8e9ee;--bg:#f6f7fa;--ok:#12a150;--ok-l:#e6f6ee}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:transparent;color:var(--ink);padding:8px}
.tool{max-width:820px;margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 30px rgba(20,20,40,.07);overflow:hidden}
.head{background:linear-gradient(120deg,var(--red),var(--red-d));color:#fff;padding:20px 24px}
.head h1{margin:0 0 4px;font-size:1.3rem}
.head p{margin:0;font-size:.9rem;opacity:.92}
.body{padding:20px 24px}
.row{display:grid;grid-template-columns:1.4fr 1fr 1fr 1.1fr 40px;gap:10px;align-items:end;padding:14px;margin-bottom:12px;background:var(--bg);border:1px solid var(--line);border-radius:12px}
label{display:block;font-size:.72rem;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;margin-bottom:5px}
input,select{width:100%;height:42px;padding:0 12px;font:inherit;font-size:.95rem;color:var(--ink);background:#fff;border:1px solid #d9dbe3;border-radius:8px;outline:none;transition:.15s}
input:focus,select:focus{border-color:var(--red);box-shadow:0 0 0 3px rgba(229,37,42,.15)}
.del{height:42px;border:0;border-radius:8px;background:#fff;color:var(--mut);font-size:1.1rem;cursor:pointer;border:1px solid #d9dbe3}
.del:hover{color:var(--red);border-color:var(--red);background:var(--red-l)}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{height:44px;padding:0 18px;border-radius:8px;font:inherit;font-weight:600;cursor:pointer;border:1px solid var(--red);transition:.15s}
.add{background:#fff;color:var(--red)}
.add:hover{background:var(--red-l)}
.reset{background:#fff;color:var(--mut);border-color:#d9dbe3}
.reset:hover{color:var(--ink)}
#res{margin-top:22px}
#res h2{font-size:1.05rem;margin:0 0 12px}
.grp{font-size:.78rem;font-weight:700;color:var(--red);text-transform:uppercase;letter-spacing:.05em;margin:16px 0 8px}
.card{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:#fff}
.card.best{border-color:var(--ok);background:var(--ok-l)}
.nm{font-weight:600}
.sub{font-size:.8rem;color:var(--mut);margin-top:2px}
.badge{display:inline-block;font-size:.68rem;font-weight:700;background:var(--ok);color:#fff;border-radius:99px;padding:2px 9px;margin-left:8px;vertical-align:middle}
.up{font-size:1.2rem;font-weight:700;text-align:right;white-space:nowrap}
.up small{display:block;font-size:.75rem;font-weight:500;color:var(--mut)}
.worse{color:var(--red-d)!important}
.sum{background:var(--red-l);border-left:4px solid var(--red);padding:12px 14px;border-radius:8px;font-size:.92rem;margin-top:12px}
.empty{color:var(--mut);font-size:.92rem;padding:14px;border:1px dashed #d0d3dc;border-radius:12px;text-align:center}
.foot{text-align:center;font-size:.75rem;color:var(--mut);padding:0 0 16px}
.foot a{color:var(--red);text-decoration:none;font-weight:600}
@media(max-width:640px){.row{grid-template-columns:1fr 1fr}.row>div:first-child{grid-column:1/-1}.del{grid-column:1/-1}.body,.head{padding-left:16px;padding-right:16px}}
</style>
</head>
<body>
<div class="tool">
  <div class="head">
    <h1>Birim Fiyat Hesaplama Aracı</h1>
    <p>Farklı paket boyutlarını karşılaştırın, gerçekten en ucuz olanı bulun.</p>
  </div>
  <div class="body">
    <div id="rows"></div>
    <div class="actions">
      <button class="btn add" id="add" type="button">+ Ürün Ekle</button>
      <button class="btn reset" id="reset" type="button">Temizle</button>
    </div>
    <div id="res" aria-live="polite"></div>
  </div>
  <div class="foot">Hazırlayan: <a href="https://teknobird.com" target="_blank" rel="noopener">Teknobird</a></div>
</div>

<script>
const U={adet:['Adet','c',1],paket:['Paket','c',1],kutu:['Kutu','c',1],g:['Gram','w',.001],kg:['Kilogram','w',1],ml:['Mililitre','v',.001],l:['Litre','v',1],cm:['Santimetre','l',.01],m:['Metre','l',1]};
const G={c:['Adet','adet'],w:['Ağırlık','kg'],v:['Hacim','litre'],l:['Uzunluk','metre']};
const MAX=8;
let items=[];
const $=id=>document.getElementById(id);
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num=v=>parseFloat(String(v).replace(/\./g,'').replace(',','.'))||0;
const fmt=n=>n.toLocaleString('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2})+' ₺';
const blank=()=>({n:'',p:'',q:'',u:'adet'});

function renderRows(){
  $('rows').innerHTML=items.map((it,i)=>`
  <div class="row">
    <div><label>Ürün adı</label><input data-i="${i}" data-k="n" value="${esc(it.n)}" placeholder="Ürün ${String.fromCharCode(65+i)}"></div>
    <div><label>Fiyat (₺)</label><input data-i="${i}" data-k="p" value="${esc(it.p)}" inputmode="decimal" placeholder="0,00"></div>
    <div><label>Miktar</label><input data-i="${i}" data-k="q" value="${esc(it.q)}" inputmode="decimal" placeholder="Örn. 500"></div>
    <div><label>Birim</label><select data-i="${i}" data-k="u">${Object.entries(U).map(([k,v])=>`<option value="${k}"${k===it.u?' selected':''}>${v[0]}</option>`).join('')}</select></div>
    <button class="del" type="button" data-del="${i}" title="Sil" aria-label="Ürünü sil">✕</button>
  </div>`).join('');
  calc();
}

function calc(){
  const groups={};
  items.forEach((it,i)=>{
    const p=num(it.p),q=num(it.q),[,g,f]=U[it.u];
    if(p>0&&q>0)(groups[g]=groups[g]||[]).push({name:it.n.trim()||'Ürün '+String.fromCharCode(65+i),p,q,u:it.u,up:p/(q*f)});
  });
  const keys=Object.keys(groups);
  if(!keys.length){$('res').innerHTML='<div class="empty">Fiyat ve miktar girdiğinizde sonuçlar burada görünür.</div>';send();return}
  let h='<h2>Sonuçlar</h2>';
  keys.forEach(g=>{
    const list=groups[g].sort((a,b)=>a.up-b.up),best=list[0];
    if(keys.length>1)h+=`<div class="grp">${G[g][0]} karşılaştırması</div>`;
    list.forEach((r,i)=>{
      const diff=(r.up/best.up-1)*100;
      h+=`<div class="card${i?'':' best'}"><div><div class="nm">${esc(r.name)}${i?'':'<span class="badge">EN UCUZ</span>'}</div>
      <div class="sub">${fmt(r.p)} · ${r.q.toLocaleString('tr-TR')} ${U[r.u][0]}</div></div>
      <div class="up${i?' worse':''}">${fmt(r.up)}<small>1 ${G[g][1]} başına${i?' · %'+diff.toFixed(1).replace('.',',')+' pahalı':''}</small></div></div>`;
    });
    if(list.length>1){
      const w=list[list.length-1],s=(1-best.up/w.up)*100;
      h+=`<div class="sum"><b>${esc(best.name)}</b>, en pahalı seçenek olan ${esc(w.name)} ürününe göre birim başına yaklaşık <b>%${s.toFixed(1).replace('.',',')}</b> tasarruf sağlar.</div>`;
    }
  });
  if(keys.length>1)h+='<div class="sum">Farklı ölçü türleri girdiniz; ürünler yalnızca kendi türleri içinde karşılaştırıldı.</div>';
  $('res').innerHTML=h;send();
}

function send(){ // iframe yüksekliğini üst sayfaya bildirir
  try{parent.postMessage({type:'tb-height',h:document.documentElement.scrollHeight},'*')}catch(e){}
}

$('rows').addEventListener('input',e=>{const t=e.target;if(t.dataset.k){items[t.dataset.i][t.dataset.k]=t.value;calc()}});
$('rows').addEventListener('click',e=>{const d=e.target.closest('[data-del]');if(d&&items.length>2){items.splice(d.dataset.del,1);renderRows()}});
$('add').onclick=()=>{if(items.length<MAX){items.push(blank());renderRows()}};
$('reset').onclick=()=>{items=[blank(),blank()];renderRows()};
items=[blank(),blank()];renderRows();
window.addEventListener('load',send);window.addEventListener('resize',send);
</script>
</body>
</html>

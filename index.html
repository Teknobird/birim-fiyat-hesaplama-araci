<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Birim Fiyat Hesaplama Aracı | Teknobird</title>
<meta name="description" content="Ürünlerin birim fiyatını hesaplayın, farklı paket boyutlarını karşılaştırın ve en ekonomik seçeneği saniyeler içinde bulun.">
<style>
:root{--red:#e12e2e;--red-d:#b81a1f;--red-l:#fdecec;--ink:#1c1c24;--mut:#6b6f7b;--line:#e8e9ee;--bg:#f6f7fa;--ok:#12a150;--ok-l:#e6f6ee}
*{box-sizing:border-box}
html,body{margin:0;overflow-x:hidden;overflow-y:auto}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:transparent;color:var(--ink);padding:6px}
.tool{max-width:820px;margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 6px 24px rgba(20,20,40,.07);overflow:hidden}
.head{background:linear-gradient(120deg,var(--red),var(--red-d));color:#fff;padding:14px 20px}
.head h1{margin:0 0 2px;font-size:1.15rem}
.head p{margin:0;font-size:.82rem;opacity:.92}
.body{padding:14px 20px 12px}
.cols,.row{display:grid;grid-template-columns:1.5fr 1fr 1fr 1.2fr 38px;gap:8px;align-items:center}
.cols{font-size:.68rem;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px;padding:0 2px}
.row{margin-bottom:8px}
input,select{width:100%;height:42px;padding:0 10px;font:inherit;font-size:.92rem;color:var(--ink);background:var(--bg);border:1px solid #dcdee6;border-radius:8px;outline:none;transition:.15s}
input:focus,select:focus{border-color:var(--red);background:#fff;box-shadow:0 0 0 3px rgba(225,46,46,.15)}
.del{height:42px;width:38px;border-radius:8px;background:#fff;color:var(--mut);font-size:1rem;cursor:pointer;border:1px solid #dcdee6}
.del:hover{color:var(--red);border-color:var(--red);background:var(--red-l)}
.actions{display:flex;gap:8px;margin-top:4px}
.btn{height:40px;padding:0 16px;border-radius:8px;font:inherit;font-size:.9rem;font-weight:600;cursor:pointer;border:1px solid var(--red);background:#fff;color:var(--red)}
.btn:hover{background:var(--red-l)}
.reset{color:var(--mut);border-color:#dcdee6}
#res{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.grp{font-size:.7rem;font-weight:700;color:var(--red);text-transform:uppercase;letter-spacing:.05em;margin:6px 0 4px}
.card{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 14px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;background:#fff}
.card.best{border-color:var(--ok);background:var(--ok-l)}
.nm{font-weight:600;font-size:.95rem}
.sub{font-size:.75rem;color:var(--mut)}
.badge{display:inline-block;font-size:.62rem;font-weight:700;background:var(--ok);color:#fff;border-radius:99px;padding:2px 8px;margin-left:6px;vertical-align:middle}
.up{font-size:1.05rem;font-weight:700;text-align:right;white-space:nowrap}
.up small{display:block;font-size:.7rem;font-weight:500;color:var(--mut)}
.worse{color:var(--red-d)!important}
.sum{background:var(--red-l);border-left:4px solid var(--red);padding:8px 12px;border-radius:8px;font-size:.85rem;margin-top:6px}
.empty{color:var(--mut);font-size:.88rem;padding:12px;border:1px dashed #d0d3dc;border-radius:10px;text-align:center}
.foot{text-align:center;font-size:.7rem;color:var(--mut);padding:0 0 10px}
.foot a{color:var(--red);text-decoration:none;font-weight:600}
@media(max-width:560px){
  .cols{display:none}
  .row{grid-template-columns:1fr 1fr 1.2fr;padding:10px;background:var(--bg);border:1px solid var(--line);border-radius:10px}
  .row input,.row select{background:#fff}
  .row .n{grid-column:1/3}
  .row .del{grid-column:3;grid-row:1;justify-self:end}
  .body,.head{padding-left:14px;padding-right:14px}
}
</style>
</head>
<body>
<div class="tool">
  <div class="head">
    <h1>Birim Fiyat Hesaplama Aracı</h1>
    <p>Farklı paket boyutlarını karşılaştırın, gerçekten en ucuz olanı bulun.</p>
  </div>
  <div class="body">
    <div class="cols"><span>Ürün adı</span><span>Fiyat (₺)</span><span>Miktar</span><span>Birim</span><span></span></div>
    <div id="rows"></div>
    <div class="actions">
      <button class="btn" id="add" type="button">+ Ürün Ekle</button>
      <button class="btn reset" id="reset" type="button">Temizle</button>
    </div>
    <div id="res" aria-live="polite"></div>
  </div>
  <div class="foot">Hazırlayan: <a href="https://teknobird.com" target="_blank" rel="noopener">Teknobird</a></div>
</div>

<script>
const U={adet:['Adet','c',1],paket:['Paket','c',1],kutu:['Kutu','c',1],g:['Gram','w',.001],kg:['Kilogram','w',1],ml:['Mililitre','v',.001],l:['Litre','v',1],cm:['Santimetre','l',.01],m:['Metre','l',1]};
const G={c:['Adet','adet'],w:['Ağırlık','kg'],v:['Hacim','litre'],l:['Uzunluk','metre']};
const MAX=5;
let items=[];
const $=id=>document.getElementById(id);
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num=v=>parseFloat(String(v).replace(/\./g,'').replace(',','.'))||0;
const fmt=n=>n.toLocaleString('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2})+' ₺';
const blank=()=>({n:'',p:'',q:'',u:'adet'});

function renderRows(){
  $('add').style.display=items.length>=MAX?'none':'';
  $('rows').innerHTML=items.map((it,i)=>`
  <div class="row">
    <input class="n" data-i="${i}" data-k="n" value="${esc(it.n)}" placeholder="Ürün ${String.fromCharCode(65+i)}" aria-label="Ürün adı">
    <input data-i="${i}" data-k="p" value="${esc(it.p)}" inputmode="decimal" placeholder="Fiyat ₺" aria-label="Fiyat">
    <input data-i="${i}" data-k="q" value="${esc(it.q)}" inputmode="decimal" placeholder="Miktar" aria-label="Miktar">
    <select data-i="${i}" data-k="u" aria-label="Birim">${Object.entries(U).map(([k,v])=>`<option value="${k}"${k===it.u?' selected':''}>${v[0]}</option>`).join('')}</select>
    <button class="del" type="button" data-del="${i}" title="Sil" aria-label="Ürünü sil">✕</button>
  </div>`).join('');
  calc();
}

function calc(){
  const groups={};
  items.forEach((it,i)=>{
    const p=num(it.p),q=num(it.q),[,g,f]=U[it.u];
    if(p>0&&q>0)(groups[g]=groups[g]||[]).push({name:it.n.trim()||'Ürün '+String.fromCharCode(65+i),p,q,u:it.u,up:p/(q*f)});
  });
  const keys=Object.keys(groups);
  if(!keys.length){$('res').innerHTML='<div class="empty">Fiyat ve miktar girdiğinizde sonuçlar burada görünür.</div>';return}
  let h='';
  keys.forEach(g=>{
    const list=groups[g].sort((a,b)=>a.up-b.up),best=list[0];
    if(keys.length>1)h+=`<div class="grp">${G[g][0]}</div>`;
    list.forEach((r,i)=>{
      const diff=(r.up/best.up-1)*100;
      h+=`<div class="card${i?'':' best'}"><div><div class="nm">${esc(r.name)}${i?'':'<span class="badge">EN UCUZ</span>'}</div>
      <div class="sub">${fmt(r.p)} · ${r.q.toLocaleString('tr-TR')} ${U[r.u][0]}</div></div>
      <div class="up${i?' worse':''}">${fmt(r.up)}<small>1 ${G[g][1]} başına${i?' · %'+diff.toFixed(1).replace('.',',')+' pahalı':''}</small></div></div>`;
    });
    if(list.length>1&&keys.length===1){
      const w=list[list.length-1],s=(1-best.up/w.up)*100;
      h+=`<div class="sum"><b>${esc(best.name)}</b>, en pahalı seçeneğe göre birim başına yaklaşık <b>%${s.toFixed(1).replace('.',',')}</b> tasarruf sağlar.</div>`;
    }
  });
  $('res').innerHTML=h;
}

$('rows').addEventListener('input',e=>{const t=e.target;if(t.dataset.k){items[t.dataset.i][t.dataset.k]=t.value;calc()}});
$('rows').addEventListener('click',e=>{const d=e.target.closest('[data-del]');if(d&&items.length>2){items.splice(d.dataset.del,1);renderRows()}});
$('add').onclick=()=>{if(items.length<MAX){items.push(blank());renderRows()}};
$('reset').onclick=()=>{items=[blank(),blank(),blank()];renderRows()};
items=[blank(),blank(),blank()];renderRows();
</script>
</body>
</html>
